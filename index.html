    /* =====================================================

    connectedCallback() {

        this.shadow.querySelector(
            &#34;#navJoinBtn&#34;
        ).href =
            window.CricConfig.telegramLink;


        this.checkUnlockStatus();

        this.initWarpField();

        this.initEventListeners();

        this.setupMessageListener();

        this.fetchChannels();

        window.addEventListener(
            &#34;popstate&#34;,
            () =&gt; this.handleUrlRouting()
        );

    }


    disconnectedCallback() {

        if (this.animationFrameId) {

            cancelAnimationFrame(
                this.animationFrameId
            );

        }


        if (this.lockTimer) {

            clearTimeout(
                this.lockTimer
            );

        }

    }


    /* =====================================================
       UNLOCK STATUS
       ===================================================== */

    checkUnlockStatus() {

        const saved =
            localStorage.getItem(
                &#34;cricxcrate_unlocked_time&#34;
            );


        if (saved) {

            if (

                Date.now() -
                parseInt(saved, 10)

                &lt;

                24 *
                60 *
                60 *
                1000

            ) {

                this.isUnlocked =
                    true;

            } else {

                localStorage.removeItem(
                    &#34;cricxcrate_unlocked_time&#34;
                );

            }

        }


        if (!this.isUnlocked) {

            setTimeout(() =&gt; {

                const desc =
                    this.shadow.querySelector(
                        &#34;#tgModalDesc&#34;
                    );


                const modal =
                    this.shadow.querySelector(
                        &#34;#tgPremiumModal&#34;
                    );


                if (desc) {

                    desc.innerText =
                        &#34;Join Our Telegram Channel For 24-Hour Full Access To Uninterrupted HD Live Streams And Updates.&#34;;

                }


                if (modal) {

                    modal.classList.add(
                        &#34;show&#34;
                    );

                }

            }, 200);

        }

    }


    /* =====================================================
       FETCH CHANNELS
       ===================================================== */

    async fetchChannels() {

        const grid =
            this.shadow.querySelector(
                &#34;#channels-grid&#34;
            );


        try {

            const res =
                await fetch(
                    window.CricConfig.sourceUrl
                );


            if (!res.ok) {

                throw new Error(
                    &#34;HTTP &#34; +
                    res.status
                );

            }


            const data =
                await res.json();


            this.masterChannels =
    Array.isArray(data)
        ? data
        : (
            data.iframes ||
            data.channels ||
            data.streams ||
            data.data ||
            (
                data &amp;&amp;
                typeof data === &#34;object&#34;
                    ? Object.entries(data).map(
                        ([id, url]) =&gt; ({
                            id,
                            name: id,
                            title: id,
                            url
                        })
                    )
                    : []
            )
        );


            if (
                this.masterChannels.length === 0
            ) {

                grid.innerHTML =
                    `
                    &lt;div class=&#34;state-container&#34;&gt;
                        No channels found.
                    &lt;/div&gt;
                    `;

                return;
            }


            this.renderGrid();

            this.handleUrlRouting();


        } catch (err) {

            console.error(
                &#34;Channel feed error:&#34;,
                err
            );


            grid.innerHTML =
                `
                &lt;div
                    class=&#34;state-container&#34;
                    style=&#34;color:#ef4444;&#34;
                &gt;
                    Failed to load channels feed.
                &lt;/div&gt;
                `;

            if (this.initialPendingId) {

                this.closePlayer();

            }

        }

    }

                        &gt;

                            &lt;path
                                d=&#34;
                                M12 2L2 7l10 5 10-5-10-5z
                                M2 17l10 5 10-5
                                M2 12l10 5 10-5
                                &#34;
                            /&gt;

                        &lt;/svg&gt;
                        `;


                    thumbHtml =
                        `
                        &lt;div
                            class=&#34;card-thumbnail&#34;
                        &gt;

                            &lt;div
                                class=&#34;channel-badge-box&#34;
                            &gt;
                                ${badgeIcon}
                            &lt;/div&gt;


                            &lt;span
                                class=&#34;card-network-tag&#34;
                            &gt;
                                ${this.escapeHtml(
                                    tagText
                                )}
                            &lt;/span&gt;


                            &lt;div
                                class=&#34;play-overlay-icon&#34;
                            &gt;

                                &lt;svg
                                    viewBox=&#34;0 0 24 24&#34;
                                &gt;

                                    &lt;path
                                        d=&#34;M8 5v14l11-7z&#34;
                                    /&gt;

                                &lt;/svg&gt;

                            &lt;/div&gt;

                        &lt;/div&gt;
                        `;

                }


                const card =
                    document.createElement(
                        &#34;div&#34;
                    );


                card.className =
                    &#34;channel-card&#34;;


                card.onclick =
                    () =&gt;
                        this.openPlayer(
                            channelId
                        );


                card.innerHTML =
                    `

                    ${thumbHtml}


                    &lt;div class=&#34;card-body&#34;&gt;

                        &lt;div
                            class=&#34;card-title&#34;
                        &gt;
                            ${this.escapeHtml(
                                title
                            )}
                        &lt;/div&gt;


                        &lt;div
                            class=&#34;card-meta&#34;
                        &gt;

                            &lt;span&gt;
                                HD FEED
                            &lt;/span&gt;


                            &lt;span
                                style=&#34;
                                    color:
                                    var(--accent);
                                &#34;
                            &gt;
                                WATCH NOW
                            &lt;/span&gt;

                        &lt;/div&gt;

                    &lt;/div&gt;

                    `;


                grid.appendChild(
                    card
                );

            }
        );

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    escapeHtml(value) {

        return String(value)

            .replace(
                /&amp;/g,
                &#34;&amp;amp;&#34;
            )

            .replace(
                /&lt;/g,
                &#34;&amp;lt;&#34;
            )

            .replace(
                /&gt;/g,
                &#34;&amp;gt;&#34;
            )

            .replace(
                /&#34;/g,
                &#34;&amp;quot;&#34;
            )

            .replace(
                /&#39;/g,
                &#34;&amp;#039;&#34;
            );

    }


    /* =====================================================
       OPEN PLAYER
       ===================================================== */

    openPlayer(identifier) {

        const target =
            this.masterChannels.find(
                (ch, idx) =&gt;
                    ch.id == identifier ||
                    idx == identifier
            );


        if (!target) {
            this.closePlayer();
            return;
        }


        let streamUrl =

            target.iframeSrc ||

            target.url ||

            target.link ||

            target.stream ||

            target.file ||

            target.source ||

            target.src;


        if (!streamUrl) {

            streamUrl =
                `https://sonucdn-v2.pages.dev/star.html?id=${encodeURIComponent( 
                    target.id || 
                    identifier 
                )}`; 
 
        } 
 
 
        const title = 
 
            target.title || 
 
            target.name || 
 
            target.channel || 
 
            &#34;Live Broadcast&#34;; 
 
 
        this.currentStreamId = 
            identifier; 
 
 
        this.shadow.querySelector( 
            &#34;#activeStreamTitleDisplay&#34; 
        ).innerText = 
            title; 
 
 
        this.shadow.querySelector( 
            &#34;#player&#34; 
        ).src = 
            streamUrl; 


        const loadingOverlay = 
            this.shadow.querySelector( 
                &#34;#streamLoadingOverlay&#34; 
            ); 

        if (loadingOverlay) { 

            loadingOverlay.classList.add( 
                &#34;hidden&#34; 
            ); 

        } 
 
 
        this.shadow.querySelector( 
            &#34;#home-view&#34; 
        ).classList.remove( 
            &#34;active&#34; 
        ); 
 
 
        this.shadow.querySelector( 
            &#34;#player-view&#34; 
        ).classList.add( 
            &#34;active&#34; 
        ); 
 
 
        if (!this.isUnlocked) { 
 
            if (this.lockTimer) { 
 
                clearTimeout( 
                    this.lockTimer 
                ); 
 
            } 
 
 
            this.lockTimer = 
                setTimeout( 
                    () =&gt; 
                        this.triggerLock(), 
 
                    window.CricConfig 
                        .previewDuration 
                ); 
 
        } 
 
 
        const query = 
            `?id=${encodeURIComponent( 
                identifier 
            )}`; 
 
 
        if ( 
            window.location.search !== 
            query 
        ) { 
 
            history.pushState( 
                { 
                    playerOpen: 
                        true, 
 
                    id: 
                        identifier 
                }, 
 
                &#34;&#34;, 
 
                query 
            ); 
 
        } 
 
 
        window.scrollTo( 
            0, 
            0 
        ); 
 
    } 
 
 
    /* ===================================================== 
       CLOSE PLAYER 
       ===================================================== */ 
 
    closePlayer() { 
 
        this.shadow.querySelector( 
            &#34;#player&#34; 
        ).src = 
            &#34;about:blank&#34;; 
 
 
        const loadingOverlayEl = 
            this.shadow.querySelector( 
                &#34;#streamLoadingOverlay&#34; 
            ); 
 
        if (loadingOverlayEl) { 
 
            loadingOverlayEl.classList.add( 
                &#34;hidden&#34; 
            ); 
 
        } 
 
 
        if (this.lockTimer) { 
 
            clearTimeout( 
                this.lockTimer 
            ); 
 
            this.lockTimer = 
                null; 
        } 
 
 
        this.shadow.querySelector( 
            &#34;#tgPremiumModal&#34; 
        ).classList.remove( 
            &#34;show&#34; 
        ); 
 
 
        try { 
 
            if ( 
                document.fullscreenElement 
            ) { 
 
                document.exitFullscreen() 
                    .catch( 
                        () =&gt; {} 
                    ); 
 
            } 
 
        } catch (err) {} 
 
 
        this.shadow.querySelector( 
            &#34;#playerContainer&#34; 
        ).classList.remove( 
            &#34;fs-active&#34; 
        ); 
 
 
        this.shadow.querySelector( 
            &#34;#themeSwitchDeck&#34; 
        ).classList.remove( 
            &#34;hidden&#34; 
        ); 
 
 
        this.shadow.querySelector( 
            &#34;#player-view&#34; 
        ).classList.remove( 
            &#34;active&#34; 
        ); 
 
 
        this.shadow.querySelector( 
            &#34;#home-view&#34; 
        ).classList.add( 
            &#34;active&#34; 
        ); 
 
 
        this.currentStreamId = 
            null; 
 
 
        if ( 
            window.location.search !== 
            &#34;&#34; 
        ) { 
 
            history.pushState( 
                {}, 
                &#34;&#34;, 
                window.location.pathname 
            ); 
 
        } 
 
    } 
 
 
    /* ===================================================== 
       URL ROUTING 
       ===================================================== */ 
 
    handleUrlRouting() { 
 
        const params = 
            new URLSearchParams( 
                window.location.search 
            ); 
 
 
        const id = 
            params.get( 
                &#34;id&#34; 
            ); 
 
 
        if ( 
            id !== null &amp;&amp; 
            this.masterChannels.length &gt; 0 
        ) { 
 
            this.openPlayer( 
                id 
            ); 
 
        } else if ( 
            id === null &amp;&amp; 
            this.currentStreamId !== null 
        ) { 
 
            this.closePlayer(); 
 
        } 
 
    } 
 
 
    /* ===================================================== 
       LOCK 
       ===================================================== */ 
 
    triggerLock() { 
 
        if (this.isUnlocked) 
            return; 
 
 
        const iframe = 
            this.shadow.querySelector( 
                &#34;#player&#34; 
            ); 
 
 
        try { 
 
            if ( 
                iframe &amp;&amp; 
                iframe.contentWindow 
            ) { 
 
                iframe.contentWindow.postMessage( 
                    &#34;cricxcrate-force-pause&#34;, 
                    &#34;*&#34; 
                ); 
 
            } 
 
        } catch (e) {} 
 
 
        try { 
 
            if ( 
                document.fullscreenElement 
            ) { 
 
                document.exitFullscreen() 
                    .catch( 
                        () =&gt; {} 
                    ); 
 
            } 
 
        } catch (err) {} 
 
 
        this.shadow.querySelector( 
            &#34;#tgModalDesc&#34; 
        ).innerText = 
            &#34;Free Preview Ended! Join Our Telegram To Unlock 24-Hour Uninterrupted Access With Zero Locks.&#34;; 
 
 
        this.shadow.querySelector( 
            &#34;#tgPremiumModal&#34; 
        ).classList.add( 
            &#34;show&#34; 
        ); 
 
    } 
 
 
    /* ===================================================== 
       TELEGRAM 
       ===================================================== */ 
 
    handleJoinTelegram() { 
 
        localStorage.setItem( 
            &#34;cricxcrate_unlocked_time&#34;, 
            Date.now().toString() 
        ); 
 
 
        this.isUnlocked = 
            true; 
 
 
        this.shadow.querySelector( 
            &#34;#tgPremiumModal&#34; 
        ).classList.remove( 
            &#34;show&#34; 
        ); 
 
 
        window.open( 
            window.CricConfig.telegramLink, 
            &#34;_blank&#34;, 
            &#34;noopener&#34; 
        ); 
 
 
        const laterBtn = 
            this.shadow.querySelector( 
                &#34;#tgLaterModalBtn&#34; 
            ); 
 
 
        if (laterBtn) { 
 
            laterBtn.style.display = 
                &#34;flex&#34;; 
 
        } 
 
 
        const iframe = 
            this.shadow.querySelector( 
                &#34;#player&#34; 
            ); 
 
 
        try { 
 
            if ( 
                iframe &amp;&amp; 
                iframe.contentWindow 
            ) { 
 
                iframe.contentWindow.postMessage( 
                    &#34;cricxcrate-force-play&#34;, 
                    &#34;*&#34; 
                ); 
 
            } 
 
        } catch (e) {} 
 
    } 
 
 
    /* ===================================================== 
       LATER 
       ===================================================== */ 
 
    handleLater() { 
 
        this.laterCount++; 
 
 
        if ( 
            this.laterCount &gt;= 2 
        ) { 
 
            const laterBtn = 
                this.shadow.querySelector( 
                    &#34;#tgLaterModalBtn&#34; 
                ); 
 
 
            if (laterBtn) { 
 
                laterBtn.style.display = 
                    &#34;none&#34;; 
 
            } 
 
 
            this.shadow.querySelector( 
                &#34;#tgModalDesc&#34; 
            ).innerText = 
                &#34;Access Limit Reached! Please Join Our Telegram Channel To Proceed.&#34;; 
 
 
            return; 
 
        } 
 
 
        this.shadow.querySelector( 
            &#34;#tgPremiumModal&#34; 
        ).classList.remove( 
            &#34;show&#34; 
        ); 
 
 
        const iframe = 
            this.shadow.querySelector( 
                &#34;#player&#34; 
            ); 
 
 
        try { 
 
            if ( 
                iframe &amp;&amp; 
                iframe.contentWindow 
            ) { 
 
                iframe.contentWindow.postMessage( 
                    &#34;cricxcrate-force-play&#34;, 
                    &#34;*&#34; 
                ); 
 
            } 
 
        } catch (e) {} 
 
    } 
 
 
    /* ===================================================== 
       FULLSCREEN 
       ===================================================== */ 
 
    toggleFullscreen() { 
 
        const rig = 
            this.shadow.querySelector( 
                &#34;#playerContainer&#34; 
            ); 
 
 
        const themeDeck = 
            this.shadow.querySelector( 
                &#34;#themeSwitchDeck&#34; 
            ); 
 
 
        const fsIconSvg = 
            this.shadow.querySelector( 
                &#34;#fsIconSvg&#34; 
            ); 
 
 
        if (!rig) 
            return; 
 
 
        const isFull = 
            document.fullscreenElement || 
            rig.classList.contains( 
                &#34;fs-active&#34; 
            ); 
 
 
        if (!isFull) { 
 
            rig.classList.add( 
                &#34;fs-active&#34; 
            ); 
 
 
            if (themeDeck) { 
 
                themeDeck.classList.add( 
                    &#34;hidden&#34; 
                ); 
 
            } 
 
 
            if (fsIconSvg) { 
 
                fsIconSvg.innerHTML = 
                    ` 
                    &lt;path 
                        d=&#34; 
                        M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 
                        11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z 
                        &#34; 
                    /&gt; 
                    `; 
 
            } 
 
 
            try { 
 
                if ( 
                    rig.requestFullscreen 
                ) { 
 
                    rig.requestFullscreen() 
                        .catch( 
                            () =&gt; {} 
                        ); 
 
                } 
 
            } catch (err) {} 
 
 
        } else { 
 
            rig.classList.remove( 
                &#34;fs-active&#34; 
            ); 
 
 
            if (themeDeck) { 
 
                themeDeck.classList.remove( 
                    &#34;hidden&#34; 
                ); 
 
            } 
 
 
            if (fsIconSvg) { 
 
                fsIconSvg.innerHTML = 
                    ` 
                    &lt;path 
                        d=&#34; 
                        M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 
                        7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z 
                        &#34; 
                    /&gt; 
                    `; 
 
            } 
 
 
            try { 
 
                if ( 
                    document.exitFullscreen 
                ) { 
 
                    document.exitFullscreen() 
                        .catch( 
                            () =&gt; {} 
                        ); 
 
                } 
 
            } catch (err) {} 
 
        } 
 
    } 
 
 
    /* ===================================================== 
       MESSAGE LISTENER 
       ===================================================== */ 
 
    setupMessageListener() { 
 
        window.addEventListener( 
            &#34;message&#34;, 
            (e) =&gt; { 
 
                if ( 
 
                    e.data === 
                    &#34;cricxcrate-playing&#34; &amp;&amp; 
 
                    !this.isUnlocked &amp;&amp; 
 
                    !this.lockTimer 
 
                ) { 
 
                    this.lockTimer = 
                        setTimeout( 
 
                            () =&gt; 
                                this.triggerLock(), 
 
                            window.CricConfig 
                                .previewDuration 
 
                        ); 
 
                } 
 
            } 
        ); 
 
 
        document.addEventListener( 
            &#34;fullscreenchange&#34;, 
            () =&gt; { 
 
                const rig = 
                    this.shadow.querySelector( 
                        &#34;#playerContainer&#34; 
                    ); 
 
 
                const themeDeck = 
                    this.shadow.querySelector( 
                        &#34;#themeSwitchDeck&#34; 
                    ); 
 
 
                const fsIconSvg = 
                    this.shadow.querySelector( 
                        &#34;#fsIconSvg&#34; 
                    ); 
 
 
                if ( 
 
                    !document.fullscreenElement &amp;&amp; 
 
                    !document.webkitIsFullScreen &amp;&amp; 
 
                    rig 
 
                ) { 
 
                    rig.classList.remove( 
                        &#34;fs-active&#34; 
                    ); 
 
 
                    if (themeDeck) { 
 
                        themeDeck.classList.remove( 
                            &#34;hidden&#34; 
                        ); 
 
                    } 
 
 
                    if (fsIconSvg) { 
 
                        fsIconSvg.innerHTML = 
                            ` 
                            &lt;path 
                                d=&#34; 
                                M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 
                                7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z 
                                &#34; 
                            /&gt; 
                            `; 
 
                    } 
 
                } 
 
            } 
        ); 
 
    } 
 
 
    /* ===================================================== 
       EVENT LISTENERS 
       ===================================================== */ 
 
    initEventListeners() { 
 
        this.shadow.querySelector( 
            &#34;#backHomeBtn&#34; 
        ).onclick = 
            () =&gt; 
                this.closePlayer(); 
 
 
        this.shadow.querySelector( 
            &#34;#brandHomeLink&#34; 
        ).onclick = 
            () =&gt; 
                this.closePlayer(); 
 
 
        this.shadow.querySelector( 
            &#34;#tgJoinModalBtn&#34; 
        ).onclick = 
            () =&gt; 
                this.handleJoinTelegram(); 
 
 
        this.shadow.querySelector( 
            &#34;#tgLaterModalBtn&#34; 
        ).onclick = 
            () =&gt; 
                this.handleLater(); 
 
 
        this.shadow.querySelector( 
            &#34;#blendedFsBtn&#34; 
        ).onclick = 
            () =&gt; 
                this.toggleFullscreen(); 
 
 
        /* DARK THEME */ 
 
        this.shadow.querySelector( 
            &#34;#themeDarkBtn&#34; 
        ).onclick = 
            () =&gt; { 
 
                this.removeAttribute( 
                    &#34;data-theme&#34; 
                ); 
 
 
                this.shadow.querySelector( 
                    &#34;#themeDarkBtn&#34; 
                ).classList.add( 
                    &#34;active&#34; 
                ); 
 
 
                this.shadow.querySelector( 
                    &#34;#themeLightBtn&#34; 
                ).classList.remove( 
                    &#34;active&#34; 
                ); 
 
            }; 
 
 
        /* LIGHT THEME */ 
 
        this.shadow.querySelector( 
            &#34;#themeLightBtn&#34; 
        ).onclick = 
            () =&gt; { 
 
                this.setAttribute( 
                    &#34;data-theme&#34;, 
                    &#34;light&#34; 
                ); 
 
 
                this.shadow.querySelector( 
                    &#34;#themeLightBtn&#34; 
                ).classList.add( 
                    &#34;active&#34; 
                ); 
 
 
                this.shadow.querySelector( 
                    &#34;#themeDarkBtn&#34; 
                ).classList.remove( 
                    &#34;active&#34; 
                ); 
 
            }; 
 
 
        /* SHARE */ 
 
        const btnShare = 
            this.shadow.querySelector( 
                &#34;#btnShare&#34; 
            ); 
 
 
        const shareText = 
            this.shadow.querySelector( 
                &#34;#shareBtnText&#34; 
            ); 
 
 
        btnShare.onclick = 
            async () =&gt; { 
 
                try { 
 
                    if ( 
                        navigator.share 
                    ) { 
 
                        await navigator.share({ 
 
                            title: 
                                &#34;ARJUN CRICKET Live&#34;, 
 
                            url: 
                                window.location.href 
 
                        }); 
 
                    } else { 
 
                        await navigator.clipboard 
                            .writeText( 
                                window.location.href 
                            ); 
 
 
                        shareText.textContent = 
                            &#34;COPIED!&#34;; 
 
 
                        setTimeout( 
                            () =&gt; { 
 
                                shareText.textContent = 
                                    &#34;SHARE STREAM&#34;; 
 
                            }, 
                            1800 
                        ); 
 
                    } 
 
                } catch (err) {} 
 
            }; 
 
    } 
 
 
    /* ===================================================== 
       WARP FIELD 
       ===================================================== */ 
 
    initWarpField() { 
 
        const canvas = 
            this.shadow.getElementById( 
                &#34;warpGridCanvas&#34; 
            ); 
 
 
        if (!canvas) 
            return; 
 
 
        const ctx = 
            canvas.getContext( 
                &#34;2d&#34; 
            ); 
 
 
        const resize = 
            () =&gt; { 
 
                canvas.width = 
                    window.innerWidth; 
 
                canvas.height = 
                    window.innerHeight; 
 
            }; 
 
 
        window.addEventListener( 
            &#34;resize&#34;, 
            resize 
        ); 
 
 
        resize(); 
 
 
        for ( 
            let i = 0; 
            i &lt; 100; 
            i++ 
        ) { 
 
            this.stars.push({ 
 
                x: 
                    Math.random() * 
                    canvas.width, 
 
                y: 
                    Math.random() * 
                    canvas.height, 
 
                length: 
                    Math.random() * 
                    20 + 
                    10, 
 
                speed: 
                    Math.random() * 
                    2 + 
                    1, 
 
                alpha: 
                    Math.random() * 
                    0.5 + 
                    0.1 
 
            }); 
 
        } 
 
 
        const render = 
            () =&gt; { 
 
                ctx.clearRect( 
                    0, 
                    0, 
                    canvas.width, 
                    canvas.height 
                ); 
 
 
                ctx.lineWidth = 
                    1.2; 
 
 
                this.stars.forEach( 
                    (star) =&gt; { 
 
                        ctx.strokeStyle = 
                            `rgba( 
                                0, 
                                255, 
                                204, 
                                ${star.alpha} 
                            )`; 
 
 
                        ctx.beginPath(); 
 
 
                        ctx.moveTo( 
                            star.x, 
                            star.y 
                        ); 
 
 
                        ctx.lineTo( 
                            star.x + 
                            star.length, 
 
                            star.y 
                        ); 
 
 
                        ctx.stroke(); 
 
 
                        star.x += 
                            star.speed; 
 
 
                        if ( 
                            star.x &gt; 
                            canvas.width 
                        ) { 
 
                            star.x = 
                                -star.length; 
 
 
                            star.y = 
                                Math.random() * 
                                canvas.height; 
 
                        } 
 
                    } 
                ); 
 
 
                this.animationFrameId = 
                    requestAnimationFrame( 
                        render 
                    ); 
 
            }; 
 
 
        render(); 
 
    } 
 
}

customElements.define(
